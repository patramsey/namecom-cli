name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          # Pinned, not `latest`. The action itself is SHA-pinned above, but
          # `version: latest` reached straight past that and fetched whatever
          # goreleaser had shipped by the time a tag was pushed — the same
          # mutable-upstream exposure the SHA pins exist to remove, on the one
          # job holding the Homebrew tap token.
          #
          # The exposure is not hypothetical for a job like this one: while
          # unpinned, the release that breaks is whichever one happens to run
          # after an upstream change lands, discovered at release time with a
          # tag already pushed.
          #
          # 2.17.1 is what CI actually used for the v0.2.3 release, verified
          # end to end: five archives, checksums that validate, and a working
          # Homebrew formula.
          #
          # Dependabot does not manage this input (it is a value, not an action
          # ref), so it is bumped by hand — same as govulncheck in ci.yml. When
          # bumping, run `goreleaser check` and `goreleaser release --snapshot
          # --clean` locally first, and check the generated
          # dist/homebrew/Casks/namecom.rb still carries its postflight block:
          # that hook is what keeps `brew install` off Gatekeeper's quarantine,
          # and a template change that dropped it would not fail the build.
          version: v2.17.1
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
