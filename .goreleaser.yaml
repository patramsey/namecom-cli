version: 2

project_name: namecom

before:
  hooks:
    - go mod tidy

builds:
  - binary: namecom
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

# homebrew_casks, not the deprecated `brews`. GoReleaser's formula generator
# produced, in its own words, "hackyish formulas that would install the
# pre-compiled binaries" — a formula is meant to build from source, and this
# project ships binaries. Casks are the supported shape for that now, on Linux
# as well as macOS: a cask is Linux-capable unless it declares `depends_on
# macos` (see Cask#supports_linux? in Homebrew), and the generated cask below
# declares no such dependency.
#
# Migrating renames the published file from Formula/namecom.rb to
# Casks/namecom.rb in the tap. Existing installs need tap_migrations.json in
# the tap repository to follow that rename; without it `brew upgrade` keeps
# resolving the stale formula. See the PR that introduced this.
homebrew_casks:
  - name: namecom
    binaries:
      - namecom
    homepage: https://github.com/patramsey/namecom-cli
    description: CLI for the name.com domain registrar API
    license: MIT
    directory: Casks
    repository:
      owner: patramsey
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    # Casks apply com.apple.quarantine on install; formulas did not. These
    # binaries carry only Go's ad-hoc linker signature, not a Developer ID, so
    # a quarantined copy is refused by Gatekeeper with "Apple could not verify
    # 'namecom' is free of malware" and the process is killed on first run.
    # Every macOS `brew install` since v0.2.4 has landed in that state.
    #
    # This strips the flag Homebrew itself set. It is not notarization: the
    # binary stays unsigned and `spctl -a` still rejects it, so a tarball
    # downloaded through a *browser* is still quarantined and still prompts.
    # (curl does not set the attribute, so the README's download commands are
    # unaffected — verified.) The real fix is a Developer ID certificate plus a
    # `notarize:` block, which needs a paid Apple Developer account and
    # credentials in CI.
    #
    # The xattr -h probe guards the Linux case: casks run there too (no
    # `depends_on macos` above), and /usr/bin/xattr does not exist.
    hooks:
      post:
        install: |
          if system_command("/usr/bin/xattr", args: ["-h"]).exit_status == 0
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/namecom"]
          end

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge branch
