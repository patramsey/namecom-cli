# Codecov configuration.
#
# The `ignore` list below is the whole reason this file exists. Without it the
# reported number is not merely pessimistic, it is wrong by a factor of ~2.7:
# internal/api/gen/zz_generated.go is 7,488 of the repository's 11,848
# statements — 63% of the codebase — and it is generated by oapi-codegen from
# the vendored OpenAPI spec. Covering it would mean writing tests for somebody
# else's code generator.
#
# Measured at the time this was added: 23.4% including the generated client,
# 63.6% excluding it. The second number is the one that says anything about
# this project.
#
# The generator's own behavior is not untested, incidentally — the 3.1 -> 3.0
# preprocessing it depends on is covered by internal/api/gen/spec_transform_test.go,
# and `make verify-generate` fails CI if the committed output drifts from what
# the current generator produces.

ignore:
  - "internal/api/gen/zz_generated.go"

coverage:
  precision: 1
  round: down
  range: "50...80"

  status:
    # Informational only: report the number, never block a merge on it.
    # A coverage gate that fails a PR invites the two worst responses —
    # padding tests to clear a threshold, or merging past a red check until
    # red checks stop meaning anything.
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

comment:
  layout: "reach, diff, flags, files"
  behavior: default
  require_changes: true
