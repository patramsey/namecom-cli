version: 2

updates:
  # Go modules. Grouped, so the 164 modules behind 12 direct dependencies
  # arrive as one reviewable PR rather than a stream of them — see the
  # govulncheck step in ci.yml for the reachability-aware signal that says
  # whether we are actually exposed.
  #
  # Weekly, and the Core SDK excluded from the group so it always gets a PR of
  # its own. This was monthly with the SDK grouped in, and both halves hurt:
  #
  # - Lag. core-api-go v1.33.6 sat unproposed for two weeks. This SDK ships
  #   fixes to defects this repo reported, and a monthly check meant finding
  #   them by reading its release page instead.
  # - Coupling. The SDK breaks in patch releases (v1.33.4 and v1.33.6 both
  #   needed code changes), so a group containing it tends to arrive red — as
  #   #69 did — holding every unrelated, safe bump in the group hostage to it.
  #
  # Dependabot allows only one entry per ecosystem and directory, so a separate
  # weekly schedule for the SDK alone is not expressible; exclude-patterns is
  # the way to split it out. The cost is at most one grouped PR a week instead
  # of one a month.
  #
  # Do NOT auto-merge the SDK PR. v1.33.6 changed a request body on the wire
  # (vanity-ns update --ips "") with every test still green; it was found by
  # capturing request bodies, not by CI. A passing build is not evidence that
  # nothing a command sends has changed.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      go-dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "github.com/namedotcom/core-api-go"
        update-types:
          - minor
          - patch
    commit-message:
      prefix: chore

  # GitHub Actions. These are pinned to commit SHAs in the workflows rather
  # than floating major tags, because a tag is mutable: whoever controls the
  # upstream repo can repoint v4 at new code, and release.yml holds the token
  # that publishes binaries and pushes to the Homebrew tap. Pinning removes
  # that hijack path but freezes the actions, including security fixes — which
  # is exactly why this entry exists. Dependabot reads the `# vX.Y.Z` comment
  # beside each SHA, so it can bump the pin and rewrite the comment together.
  #
  # Do not "simplify" a pin back to a bare tag; it silently restores the
  # mutable reference this is here to remove.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
        # Majors are excluded from the group deliberately, matching the gomod
        # entry above. An update outside a group still gets a PR — it just gets
        # its own, rather than riding along in a batch. That is the point: these
        # actions run the release job that holds the Homebrew tap token, and a
        # major bump can change runtime, inputs, or defaults. The first grouped
        # run proposed checkout v4->v7, setup-go v5->v7, and
        # golangci-lint-action v7->v9 as a single PR whose only evidence was a
        # green CI run.
        update-types:
          - minor
          - patch
    commit-message:
      prefix: chore
