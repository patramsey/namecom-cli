name: Release

on:
  push:
    tags:
      - "v*"

# Read-only by default; the release job below asks for exactly what it uses.
permissions:
  contents: read

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      # Create the GitHub release and upload its assets.
      contents: write
      # Build provenance: id-token mints the OIDC token Sigstore signs with,
      # attestations stores the result where `gh attestation verify` finds it.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # No module/build cache in the job that holds the tap token: what
          # ships is built from a clean download verified against go.sum, not
          # from a cache some earlier run wrote.
          cache: false

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          # Pinned, not `latest`. The action itself is SHA-pinned above, but
          # `version: latest` reached straight past that and fetched whatever
          # goreleaser had shipped by the time a tag was pushed — the same
          # mutable-upstream exposure the SHA pins exist to remove, on the one
          # job holding the Homebrew tap token.
          #
          # The exposure is not hypothetical for a job like this one: while
          # unpinned, the release that breaks is whichever one happens to run
          # after an upstream change lands, discovered at release time with a
          # tag already pushed.
          #
          # 2.17.1 is what CI actually used for the v0.2.3 release, verified
          # end to end: five archives, checksums that validate, and a working
          # Homebrew formula.
          #
          # Dependabot does not manage this input (it is a value, not an action
          # ref), so it is bumped by hand — same as govulncheck in ci.yml. When
          # bumping, run `goreleaser release --snapshot --clean` locally first
          # and confirm dist/homebrew/Formula/namecom.rb is still generated.
          #
          # `goreleaser check` exits non-zero on this config and that is
          # expected, not a regression: `brews` is hard-deprecated in favour of
          # `homebrew_casks`. Switching to satisfy the check would reintroduce
          # Gatekeeper quarantine on every macOS install — see the long comment
          # in .goreleaser.yaml before touching it. Deprecated options are only
          # removed on major versions, so the forcing function is GoReleaser
          # v3, not this warning.
          version: v2.17.1
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

      - name: Attest build provenance
        # Signs a SLSA provenance statement for every archive listed in
        # checksums.txt, binding each digest to this workflow, commit and tag.
        # Users check it with `gh attestation verify <archive> --repo
        # patramsey/namecom-cli`; the unsigned checksums.txt alone catches
        # corruption, not a swapped release asset.
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: ./dist/checksums.txt
