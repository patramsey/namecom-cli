# Codecov configuration.
#
# The `ignore` list that used to be the whole reason this file existed is gone
# with the generated client: internal/api/gen/zz_generated.go was 63% of the
# repository's statements and dragged the reported number down by a factor of
# ~2.7. The CLI now uses upstream's own SDK, which lives in the module cache and
# was never part of coverage.
#
# internal/drifttest is ignored instead. It is a test helper: its statements run
# only from other packages' tests, so it reports 0% in its own package and
# depresses the total for no reason.

ignore:
  - "internal/drifttest"

coverage:
  precision: 1
  round: down
  range: "50...80"

  status:
    # Informational only: report the number, never block a merge on it.
    # A coverage gate that fails a PR invites the two worst responses —
    # padding tests to clear a threshold, or merging past a red check until
    # red checks stop meaning anything.
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

comment:
  layout: "reach, diff, flags, files"
  behavior: default
  require_changes: true
