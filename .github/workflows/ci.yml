name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Generated code is up to date
        # Catches the failure mode that produced this step: bumping
        # oapi-codegen changes its output, but a dependency bump regenerates
        # nothing, so the committed zz_generated.go silently stops matching its
        # own generator. Without this, the drift surfaces months later as a
        # 2000-line diff tangled into somebody's unrelated change.
        run: make verify-generate

      - name: Test
        # -count=1 disables the test cache. internal/api/gen shells out to
        # scripts/spec_to_30.py and reads namecom.api.yaml; Go's cache tracks
        # neither, so a cached pass can hide a broken preprocessor.
        run: go test -race -count=1 ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2

  vuln:
    name: Vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: govulncheck
        # Reachability-aware, which is why this is worth running alongside
        # Dependabot rather than instead of it. Dependabot reports that a CVE
        # exists somewhere in a graph of 164 modules; govulncheck reports only
        # the ones whose vulnerable function this binary can actually reach, so
        # a failure here means we are exposed rather than merely adjacent.
        #
        # Pinned rather than @latest: an unpinned tool that runs on every push
        # is the same mutable-upstream exposure the SHA-pinned actions above
        # exist to remove. Dependabot does not manage `go install` versions, so
        # this one is bumped by hand.
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          govulncheck ./...
