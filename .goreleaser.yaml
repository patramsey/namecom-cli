version: 2

project_name: namecom

before:
  hooks:
    - go mod tidy

builds:
  - binary: namecom
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

# `brews` (a Formula), not `homebrew_casks`. This project shipped a cask from
# v0.2.4 to v0.3.1 and it was a mistake, for one reason that only shows up
# after install: Homebrew casks apply com.apple.quarantine and formulas do
# not. These are unsigned Go binaries carrying only an ad-hoc linker
# signature, so every macOS `brew install` landed quarantined and Gatekeeper
# refused to run them — "Apple could not verify 'namecom' is free of malware".
#
# The cask migration was made because goreleaser deprecated `brews`, calling
# what it generated "hackyish formulas that would install the pre-compiled
# binaries". That is goreleaser's opinion about its own output, not a Homebrew
# rule. Binary-installing formulas in third-party taps are ordinary —
# hashicorp/tap ships terraform exactly this way, and every bottle in
# homebrew/core is itself a precompiled binary. Nothing required a cask.
#
# The alternative was Developer ID signing plus notarization, which is the
# genuinely correct fix for a cask and costs ~$99/yr. For a CLI binary with
# single-digit downloads that is not proportionate, and it would not have
# been needed at all if this had stayed a formula. Do not "modernise" this
# back to homebrew_casks without either notarizing or re-reading this comment.
#
# `brews` is deprecated and will eventually be removed. When that happens the
# options are to hand-maintain a ~25-line formula or move to a cask *and*
# notarize. Not before.
brews:
  - name: namecom
    repository:
      owner: patramsey
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/patramsey/namecom-cli"
    description: "CLI for the name.com domain registrar API"
    license: "MIT"
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    # No caveats. One was carried from v0.3.2 through v0.4.2, telling anyone
    # upgrading from the Homebrew cask (v0.2.4 - v0.3.1) to run
    #
    #   brew uninstall --cask --force namecom && brew link namecom
    #
    # because `brew update` performs the cask -> formula migration but cannot
    # finish it: formula_installer.rb refuses to link while a cask of the same
    # name is installed, and brew's own message stops at the uninstall.
    #
    # That was true and necessary at the time. It is removed now because
    # caveats print on EVERY install, so the audience has inverted: the cask
    # was last published in v0.3.1, five releases back, and effectively
    # everyone reading this today is a fresh installer being handed recovery
    # steps for a path they were never on.
    #
    # The steps are not lost. They remain in the v0.3.2 CHANGELOG entry and in
    # #49, which is where someone still stranded on the cask would look.
    #
    # If a cask is ever published again, this is the block to restore.

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge branch
